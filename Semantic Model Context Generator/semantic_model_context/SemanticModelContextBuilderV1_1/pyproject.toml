[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="semantic-model-context-builder"
version="1.1.0"
requires-python=">=3.11"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
