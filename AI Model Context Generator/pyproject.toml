[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-model-context-builder"
version = "1.1.0"
description = "Local PBIP semantic model metadata exporter for AI context files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steven Foster" }]
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.scripts]
semantic-context = "semantic_model_context.cli:main"
semantic-context-gui = "semantic_model_context.app:main"

[tool.setuptools.packages.find]
include = ["semantic_model_context*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
